name: Build Exact SEO Data Index

on:
  push:
    branches: [main]
    paths:
      - 'data/businesses/**'
      - 'data/STATE.JSON'
      - 'data/DISTRICT.JSON'
      - 'data/CATEGORY.JSON'
      - 'scripts/build-seo-index.js'
      - '.github/workflows/build-category-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build exact SEO index and category shards
        run: node scripts/build-seo-index.js

      - name: Commit generated indexes
        run: |
          if git diff --quiet -- data/SEO_INDEX.JSON data/category-index; then
            echo "Generated indexes unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/SEO_INDEX.JSON data/category-index
          git commit -m "chore: rebuild exact SEO data indexes [skip ci]"
          git push
