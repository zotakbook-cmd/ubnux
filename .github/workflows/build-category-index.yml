name: Build Category Index

on:
  push:
    branches: [main]
    paths:
      - 'data/businesses/**'
      - 'data/CATEGORY.JSON'
      - 'scripts/build-category-index.js'
      - '.github/workflows/build-category-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build category indexes
        run: node scripts/build-category-index.js

      - name: Commit category indexes
        run: |
          if git diff --quiet -- data/category-index; then
            echo "Category indexes unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/category-index
          git commit -m "chore: rebuild category business indexes [skip ci]"
          git push
