name: Build Exact SEO Data Index

on:
  push:
    branches: [main]
    paths:
      - 'data/businesses/**'
      - 'data/STATE.JSON'
      - 'data/DISTRICT.JSON'
      - 'data/CATEGORY.JSON'
      - 'scripts/build-seo-index.js'
      - '.github/workflows/build-category-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build exact SEO and global search indexes
        run: node scripts/build-seo-index.js
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          node scripts/build-seo-index.js
          if git diff --quiet -- data/SEO_INDEX.JSON data/category-index data/district-index data/search-index; then
            echo "Generated indexes unchanged."
            exit 0
          fi
          git add data/SEO_INDEX.JSON data/category-index data/district-index data/search-index
          git commit -m "chore: rebuild exact SEO and global search indexes [skip ci]"
          git push origin main
