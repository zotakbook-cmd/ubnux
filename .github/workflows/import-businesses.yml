name: Import Businesses

on:
  push:
    branches: [main]
    paths:
      - 'data/import/BUSINESSES.JSON'
      - 'scripts/import-businesses.js'
      - 'scripts/generate-business-record.js'
      - 'scripts/validate-seo.js'
      - 'scripts/generate-sitemap.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import business data
        run: node scripts/import-businesses.js

      - name: Validate SEO relationships
        run: node scripts/validate-seo.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Validate generated sitemap
        run: node scripts/validate-seo.js

      - name: Commit generated business indexes and sitemap
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/businesses sitemap.xml
          git commit -m "chore: import businesses and update sitemap [skip ci]"
          git push
