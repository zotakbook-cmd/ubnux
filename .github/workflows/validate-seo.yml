name: Validate SEO

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'sitemap.xml'
      - 'scripts/**'
      - '_worker.js'
  pull_request:
    paths:
      - 'data/**'
      - 'sitemap.xml'
      - 'scripts/**'
      - '_worker.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SEO relationships and URL rules
        run: node scripts/validate-seo.js

      - name: Validate sitemap XML URLs
        run: node -e "const fs=require('fs');const s=fs.readFileSync('sitemap.xml','utf8');if(!s.startsWith('<?xml')||!s.includes('<urlset')||!s.includes('</urlset>'))process.exit(1);const u=[...s.matchAll(/<loc>(.*?)<\\/loc>/g)].map(x=>x[1]);if(!u.length||u.some(x=>!x.startsWith('https://ubnux.com/')||!x.endsWith('/')))process.exit(1);console.log('Sitemap URL checks passed:',u.length);"
